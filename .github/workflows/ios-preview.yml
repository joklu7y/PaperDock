name: iOS offline preview test

on:
  push:
    branches: [main, mobile/ios-preview, mobile/previews, mobile/full-workbench]
    paths:
      - 'mobile/ios/**'
      - 'mobile/android/prepare_models.py'
      - 'mobile/workbench/**'
      - 'app/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.*.config.ts'
      - '.github/workflows/ios-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build the shared workbench
        run: npm ci && npm run build:mobile
      - name: Prepare the offline OCR models
        run: |
          python3 mobile/android/prepare_models.py --cache "$RUNNER_TEMP/models" \
            --assets mobile/ios/PaperDockMobile/Models
      - name: Resolve Swift packages before building
        working-directory: mobile/ios
        run: |
          # The release page redirect can fail on CI. Fetch the same pinned asset via the API.
          archive="$RUNNER_TEMP/opencv2.xcframework.zip"
          curl --fail --location --retry 2 --max-time 180 \
            -H 'Accept: application/octet-stream' \
            'https://api.github.com/repos/yeatse/opencv-spm/releases/assets/275558406' -o "$archive"
          echo "13409e99956a74aaee1856c56889c211116fbc8be2bcbe373986ec9e10f536fc  $archive" | shasum -a 256 -c -
          cache="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$cache"
          cp "$archive" "$cache/https___github_com_yeatse_opencv_spm_releases_download_4_12_0_opencv2_xcframework_zip"
          xcodebuild -resolvePackageDependencies -project PaperDockMobile.xcodeproj \
            -scheme PaperDockMobile -clonedSourcePackagesDirPath "$RUNNER_TEMP/PaperDockPackages"
      - name: Run document tests on an iPhone simulator
        working-directory: mobile/ios
        run: |
          xcodebuild -version
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in reversed(list(runtimes)):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No iPhone simulator available")
          ')
          xcodebuild -project PaperDockMobile.xcodeproj -scheme PaperDockMobile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PaperDockPackages" -disableAutomaticPackageResolution \
            -destination "id=$device_id" -parallel-testing-enabled NO ONLY_ACTIVE_ARCH=YES test
      - name: Build the unsigned iPhone app
        working-directory: mobile/ios
        run: |
          xcodebuild -project PaperDockMobile.xcodeproj -scheme PaperDockMobile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/PaperDockPackages" -disableAutomaticPackageResolution \
            -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
